<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4fd1c4"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f2c879"/>
    </marker>
  </defs>
  <rect width="1200" height="380" rx="14" fill="#0b3959"/>

  <!-- 1. Human -->
  <rect x="30" y="120" width="200" height="140" rx="12" fill="#12445d" stroke="#f2c879" stroke-width="2"/>
  <text x="130" y="160" text-anchor="middle" fill="#f2c879" font-size="15" font-weight="700" letter-spacing="1">HUMAN</text>
  <text x="130" y="192" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="600">Defines the decision</text>
  <text x="130" y="218" text-anchor="middle" fill="#b4cad8" font-size="15">and the success criteria</text>
  <text x="130" y="242" text-anchor="middle" fill="#b4cad8" font-size="15">accuracy · speed · size</text>

  <line x1="232" y1="190" x2="282" y2="190" stroke="#4fd1c4" stroke-width="3" marker-end="url(#a)"/>

  <!-- 2. Sealed benchmark -->
  <rect x="288" y="120" width="190" height="140" rx="12" fill="#12445d" stroke="#4fd1c4" stroke-width="2"/>
  <g transform="translate(366,140)" fill="none" stroke="#4fd1c4" stroke-width="3">
    <path d="M6 16 v-6 a11 11 0 0 1 22 0 v6"/>
    <rect x="0" y="16" width="34" height="24" rx="4" fill="#4fd1c4" stroke="none"/>
  </g>
  <text x="383" y="212" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="600">Sealed benchmark</text>
  <text x="383" y="238" text-anchor="middle" fill="#b4cad8" font-size="15">never seen in training</text>

  <line x1="480" y1="190" x2="530" y2="190" stroke="#4fd1c4" stroke-width="3" marker-end="url(#a)"/>

  <!-- 3. The loop -->
  <circle cx="660" cy="190" r="128" fill="#12445d" stroke="#4fd1c4" stroke-width="2"/>
  <text x="660" y="120" text-anchor="middle" fill="#4fd1c4" font-size="13" font-weight="700" letter-spacing="1">AI RESEARCHER AGENTS</text>
  <text x="660" y="150" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="600">Experiment</text>
  <text x="727" y="252" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="600">Evaluate</text>
  <text x="593" y="252" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="600">Improve</text>
  <path d="M712 158 Q745 185 735 225" fill="none" stroke="#4fd1c4" stroke-width="3" marker-end="url(#a)"/>
  <path d="M690 262 L632 262" fill="none" stroke="#4fd1c4" stroke-width="3" marker-end="url(#a)"/>
  <path d="M582 226 Q575 185 606 158" fill="none" stroke="#4fd1c4" stroke-width="3" marker-end="url(#a)"/>
  <text x="660" y="196" text-anchor="middle" fill="#b4cad8" font-size="14">small local model</text>
  <text x="660" y="214" text-anchor="middle" fill="#b4cad8" font-size="14">+ its harness</text>

  <line x1="790" y1="190" x2="840" y2="190" stroke="#4fd1c4" stroke-width="3" marker-end="url(#a)"/>

  <!-- 4. Gate -->
  <polygon points="915,120 985,190 915,260 845,190" fill="#12445d" stroke="#f2c879" stroke-width="2"/>
  <text x="915" y="186" text-anchor="middle" fill="#f2c879" font-size="15" font-weight="700">Targets</text>
  <text x="915" y="206" text-anchor="middle" fill="#f2c879" font-size="15" font-weight="700">met?</text>
  <path d="M915 262 V345 H660 V322" fill="none" stroke="#f2c879" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#g)"/>
  <text x="790" y="368" text-anchor="middle" fill="#f2c879" font-size="14">no — keep looping</text>

  <line x1="987" y1="190" x2="1022" y2="190" stroke="#4fd1c4" stroke-width="3" marker-end="url(#a)"/>

  <!-- 5. Deliverable -->
  <rect x="1028" y="120" width="150" height="140" rx="12" fill="#1e5a52" stroke="#4fd1c4" stroke-width="2"/>
  <g transform="translate(1078,140)" fill="none" stroke="#7fe0b5" stroke-width="3">
    <rect x="6" y="0" width="38" height="24" rx="3"/>
    <path d="M0 30 h50"/>
  </g>
  <text x="1103" y="200" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="600">Specialised</text>
  <text x="1103" y="222" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="600">local agent</text>
  <text x="1103" y="246" text-anchor="middle" fill="#7fe0b5" font-size="14">runs offline</text>

  <text x="30" y="50" fill="#ffffff" font-size="24" font-weight="700">La Boucle</text>
  <text x="30" y="76" fill="#b4cad8" font-size="16">From a business decision to a small agent that runs on your own hardware.</text>
</svg>
